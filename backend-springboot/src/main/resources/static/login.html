<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register - BikeConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem;">

  <div style="max-width: 440px; width: 100%;">
    <!-- Logo -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="logo-group" style="justify-content: center; margin-bottom: 0.5rem;">
        <i data-lucide="bike" class="logo-icon"></i>
        <span>BikeConnect</span>
      </a>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Connect with mechanics near you</p>
    </div>

    <!-- Auth Card -->
    <div class="card" style="padding: 2rem;">
      <div id="alertBox" class="alert" style="display: none;"></div>

      <!-- Tabs Header -->
      <div class="tabs-container">
        <button id="tabLoginBtn" class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button id="tabRegisterBtn" class="tab-btn" onclick="switchTab('register')">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <div id="loginSection">
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <div style="position: relative;">
              <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem;">
            <button type="button" class="btn btn-primary btn-block" onclick="submitLogin('owner')">
              <i data-lucide="user"></i> Login as Bike Owner
            </button>
            <button type="button" class="btn btn-outline btn-block" onclick="submitLogin('mechanic')">
              <i data-lucide="wrench"></i> Login as Mechanic
            </button>
          </div>
        </form>
      </div>

      <!-- REGISTER FORM -->
      <div id="registerSection" style="display: none;">
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="regName">Full Name</label>
            <input type="text" id="regName" class="form-control" placeholder="Enter your full name" required>
          </div>

          <div class="form-group">
            <label for="regEmail">Email Address</label>
            <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label for="regPhone">Phone Number</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="Enter phone number" required>
          </div>

          <div class="form-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Create a password" required>
          </div>

          <div class="form-group">
            <label for="regConfirmPassword">Confirm Password</label>
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Confirm your password" required>
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem;">
            <button type="button" class="btn btn-primary btn-block" onclick="submitRegister('owner')">
              <i data-lucide="user-check"></i> Register as Bike Owner
            </button>
            <button type="button" class="btn btn-outline btn-block" onclick="submitRegister('mechanic')">
              <i data-lucide="wrench"></i> Register as Mechanic
            </button>
          </div>
        </form>
      </div>

      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="index.html" style="font-size: 0.9rem; color: var(--text-muted);">&larr; Back to Home</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    lucide.createIcons();

    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = 'block';
    }

    function switchTab(tab) {
      const loginSection = document.getElementById('loginSection');
      const registerSection = document.getElementById('registerSection');
      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabRegisterBtn = document.getElementById('tabRegisterBtn');
      document.getElementById('alertBox').style.display = 'none';

      if (tab === 'login') {
        loginSection.style.display = 'block';
        registerSection.style.display = 'none';
        tabLoginBtn.classList.add('active');
        tabRegisterBtn.classList.remove('active');
      } else {
        loginSection.style.display = 'none';
        registerSection.style.display = 'block';
        tabLoginBtn.classList.remove('active');
        tabRegisterBtn.classList.add('active');
      }
    }

    // Check query params on load (e.g. ?tab=register)
    const initialTab = api.getQueryParam('tab') || 'login';
    switchTab(initialTab);

    async function submitLogin(userType) {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showAlert('Please enter both email and password.');
        return;
      }

      try {
        const res = await api.post('/auth/login', { email, password, userType });
        sessionStorage.setItem('currentUser', JSON.stringify(res.user));

        if (res.user.type === 'owner') {
          window.location.href = 'owner-dashboard.html';
        } else {
          window.location.href = 'mechanic-dashboard.html';
        }
      } catch (err) {
        showAlert(err.message || 'Login failed. Please check your credentials.');
      }
    }

    async function submitRegister(userType) {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      if (!name || !email || !phone || !password) {
        showAlert('Please fill in all fields.');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('Passwords do not match.');
        return;
      }

      sessionStorage.setItem('otpEmail', email);

      try {
        const res = await api.post('/auth/register', {
          name,
          email,
          phone,
          password,
          type: userType
        });

        if (userType === 'owner') {
          window.location.href = 'owner-dashboard.html';
        } else {
          window.location.href = 'verify-otp.html';
        }
      } catch (err) {
        showAlert(err.message || 'Registration failed. Please try again.');
      }
    }
  </script>
</body>
</html>
