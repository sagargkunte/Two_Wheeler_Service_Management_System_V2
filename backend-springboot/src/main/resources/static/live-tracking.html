<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live GPS Tracking - BikeConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="height: 100vh; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Header with Live Stats Bar -->
  <header style="background: #1e3a8a; color: #ffffff; padding: 0.75rem 1.5rem; z-index: 50;">
    <div style="max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button class="btn btn-outline btn-sm" onclick="history.back()" style="background: rgba(255,255,255,0.15); color: #ffffff; border: none;">
          <i data-lucide="arrow-left"></i> Back
        </button>
        <div>
          <h2 id="dispShopName" style="font-size: 1.25rem; font-weight: 700;">Live GPS Tracking</h2>
          <span id="trackingStatusText" style="font-size: 0.8rem; color: #bfdbfe;">Ready to track route</span>
        </div>
      </div>

      <!-- Quick Metrics -->
      <div style="display: flex; align-items: center; gap: 1.5rem;">
        <div>
          <span style="font-size: 0.75rem; color: #93c5fd; display: block;">Distance</span>
          <strong id="statDistance" style="font-size: 1.2rem;">-- km</strong>
        </div>
        <div>
          <span style="font-size: 0.75rem; color: #93c5fd; display: block;">Est. Time (ETA)</span>
          <strong id="statEta" style="font-size: 1.2rem;">-- mins</strong>
        </div>
        <div>
          <span style="font-size: 0.75rem; color: #93c5fd; display: block;">Speed</span>
          <strong id="statSpeed" style="font-size: 1.2rem;">0 km/h</strong>
        </div>
        <button id="btnToggleTrack" class="btn btn-success btn-sm" onclick="toggleTracking()">
          <i data-lucide="play"></i> Start Tracking
        </button>
      </div>
    </div>
  </header>

  <!-- Fullscreen Leaflet Map -->
  <div style="flex: 1; position: relative;">
    <div id="trackingMap" style="width: 100%; height: 100%;"></div>

    <!-- Center GPS button -->
    <button onclick="centerOnUser()" class="btn btn-primary" style="position: absolute; bottom: 25px; right: 25px; z-index: 1000; border-radius: 50%; width: 50px; height: 50px; padding: 0; box-shadow: var(--shadow-lg);" title="Center on My Location">
      <i data-lucide="crosshair" style="width: 24px; height: 24px;"></i>
    </button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script>
    lucide.createIcons();

    const mechId = api.getQueryParam('mechanicId');

    let map = null;
    let userMarker = null;
    let destMarker = null;
    let routePolyline = null;
    let isTracking = false;
    let watchId = null;

    let destLat = 18.5204;
    let destLon = 73.8567;
    let currentLat = null;
    let currentLon = null;

    async function initTracking() {
      // Load mechanic destination coordinates
      if (mechId) {
        try {
          const res = await api.get(`/mechanic/${mechId}`);
          const m = res.mechanic;
          destLat = m.latitude;
          destLon = m.longitude;
          document.getElementById('dispShopName').textContent = `To: ${m.shopName}`;
        } catch (e) {
          console.error(e);
        }
      }

      // Initialize map centered at destination
      map = L.map('trackingMap').setView([destLat, destLon], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // Destination pin (Red Icon)
      const redIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
        shadowUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41]
      });

      destMarker = L.marker([destLat, destLon], { icon: redIcon }).addTo(map)
        .bindPopup('<b>Destination Workshop</b>');

      // Request user location
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLon = pos.coords.longitude;
            updateUserPosition(currentLat, currentLon);
          },
          (err) => console.log('Location access not enabled yet')
        );
      }
    }

    function updateUserPosition(lat, lon, speedMps = 0) {
      currentLat = lat;
      currentLon = lon;

      if (!userMarker) {
        userMarker = L.marker([lat, lon]).addTo(map).bindPopup('<b>Your Live Location</b>');
      } else {
        userMarker.setLatLng([lat, lon]);
      }

      // Draw polyline connecting user to destination
      if (routePolyline) map.removeLayer(routePolyline);
      routePolyline = L.polyline([ [lat, lon], [destLat, destLon] ], {
        color: '#2563eb',
        weight: 5,
        opacity: 0.8,
        dashArray: '10, 5'
      }).addTo(map);

      const bounds = L.latLngBounds([ [lat, lon], [destLat, destLon] ]);
      map.fitBounds(bounds, { padding: [60, 60] });

      // Calculate distance using Haversine
      const distKm = calculateDistance(lat, lon, destLat, destLon);
      const speedKmh = Math.max(0, speedMps * 3.6);
      const etaMin = Math.round((distKm / Math.max(speedKmh, 25)) * 60);

      document.getElementById('statDistance').textContent = `${distKm.toFixed(1)} km`;
      document.getElementById('statEta').textContent = `${etaMin} mins`;
      document.getElementById('statSpeed').textContent = `${Math.round(speedKmh)} km/h`;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function toggleTracking() {
      const btn = document.getElementById('btnToggleTrack');
      const statusText = document.getElementById('trackingStatusText');

      if (!isTracking) {
        if (!navigator.geolocation) {
          alert('Geolocation is not supported by your browser.');
          return;
        }

        isTracking = true;
        btn.innerHTML = '<i data-lucide="pause"></i> Stop';
        btn.className = 'btn btn-danger btn-sm';
        statusText.textContent = 'Live Tracking Active (GPS connected)';

        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            updateUserPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.speed || 0);
          },
          (err) => {
            statusText.textContent = 'GPS Error: ' + err.message;
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
      } else {
        isTracking = false;
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        btn.innerHTML = '<i data-lucide="play"></i> Start Tracking';
        btn.className = 'btn btn-success btn-sm';
        statusText.textContent = 'Tracking Paused';
      }
      lucide.createIcons();
    }

    function centerOnUser() {
      if (currentLat && currentLon && map) {
        map.setView([currentLat, currentLon], 16);
      }
    }

    initTracking();
  </script>
</body>
</html>
