<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Details - BikeConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button class="btn btn-outline btn-sm" onclick="history.back()">
          <i data-lucide="arrow-left"></i> Back
        </button>
        <span class="logo-group">
          <i data-lucide="calendar" class="logo-icon"></i>
          <span>Confirm Booking Details</span>
        </span>
      </div>
    </div>
  </header>

  <main class="main-content" style="max-width: 650px;">
    <div id="alertBox" class="alert" style="display: none;"></div>

    <!-- Mechanic & Bike Summary Card -->
    <div class="card" style="padding: 1.5rem; margin-bottom: 1.5rem;">
      <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1.25rem;">Appointment Summary</h3>
      
      <div style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div style="display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
          <div style="background: var(--primary-light); padding: 0.75rem; border-radius: var(--radius-md);">
            <i data-lucide="wrench" style="width: 24px; height: 24px; color: var(--primary);"></i>
          </div>
          <div>
            <div style="font-size: 0.85rem; color: var(--text-muted);">Selected Mechanic</div>
            <div id="summaryShopName" style="font-weight: 700; font-size: 1.05rem;">Loading...</div>
            <div id="summaryShopPhone" style="font-size: 0.85rem; color: var(--text-muted);"></div>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 1rem;">
          <div style="background: var(--success-light); padding: 0.75rem; border-radius: var(--radius-md);">
            <i data-lucide="bike" style="width: 24px; height: 24px; color: var(--success);"></i>
          </div>
          <div>
            <div style="font-size: 0.85rem; color: var(--text-muted);">Bike</div>
            <div id="summaryBikeName" style="font-weight: 700; font-size: 1.05rem;">Loading...</div>
            <div id="summaryBikeReg" style="font-size: 0.85rem; color: var(--text-muted);"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Booking Form Card -->
    <div class="card" style="padding: 2rem;">
      <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1.5rem;">Select Date & Time</h3>

      <form id="bookingForm" onsubmit="handleBook(event)">
        <div class="form-group">
          <label for="bookDate">Appointment Date *</label>
          <input type="date" id="bookDate" class="form-control" required>
          <small style="color: var(--text-muted); display: block; margin-top: 0.25rem;">Select a date starting from today</small>
        </div>

        <div class="form-group">
          <label for="bookTime">Appointment Time *</label>
          <input type="time" id="bookTime" class="form-control" value="10:00" required>
        </div>

        <div class="form-group">
          <label for="notes">Additional Notes for Mechanic (Optional)</label>
          <textarea id="notes" class="form-control" rows="3" placeholder="Provide any special instructions or details about symptoms..."></textarea>
        </div>

        <!-- Summary -->
        <div style="background: var(--primary-light); padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.95rem;">
            <span>Consultation & Drop-off Booking</span>
            <span style="font-weight: 600; color: var(--success);">FREE</span>
          </div>
          <div style="display: flex; justify-content: space-between; font-weight: 700; border-top: 1px solid #bfdbfe; padding-top: 0.5rem;">
            <span>Total Payable Now</span>
            <span>₹0 (Pay at workshop after service)</span>
          </div>
        </div>

        <div style="display: flex; gap: 1rem;">
          <button type="button" class="btn btn-outline" style="flex: 1;" onclick="history.back()">Cancel</button>
          <button type="submit" id="confirmBtn" class="btn btn-primary" style="flex: 2;">
            Confirm Appointment
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    lucide.createIcons();

    const mechId = api.getQueryParam('mechanicId');
    let bikeId = api.getQueryParam('bikeId');

    // Set min date to today
    const today = new Date().toISOString().split('T')[0];
    const bookDateInput = document.getElementById('bookDate');
    bookDateInput.min = today;
    bookDateInput.value = today;

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = `alert alert-${type}`;
      box.style.display = 'block';
    }

    async function loadSummary() {
      try {
        // Load mechanic
        if (mechId) {
          const res = await api.get(`/mechanic/${mechId}`);
          const mech = res.mechanic;
          document.getElementById('summaryShopName').textContent = mech.shopName;
          document.getElementById('summaryShopPhone').textContent = mech.userId ? `Phone: ${mech.userId.phone}` : '';
        }

        // Load bike (either from bikeId or from owner's latest bike)
        if (bikeId) {
          const bike = await api.get(`/api/bikes/${bikeId}`);
          document.getElementById('summaryBikeName').textContent = `${bike.name} ${bike.model}`;
          document.getElementById('summaryBikeReg').textContent = bike.registrationNumber ? `Reg: ${bike.registrationNumber}` : '';
        } else {
          // fetch owner dashboard to pick first bike
          const dash = await api.get('/api/owner-dashboard');
          if (dash.bikes && dash.bikes.length > 0) {
            const b = dash.bikes[0];
            bikeId = b.id || b._id;
            document.getElementById('summaryBikeName').textContent = `${b.name} ${b.model}`;
            document.getElementById('summaryBikeReg').textContent = b.registrationNumber ? `Reg: ${b.registrationNumber}` : '';
          } else {
            document.getElementById('summaryBikeName').textContent = 'No bike registered';
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function handleBook(e) {
      e.preventDefault();
      if (!mechId) {
        showAlert('Mechanic information is missing.');
        return;
      }
      if (!bikeId) {
        showAlert('Please add or select a bike first.');
        return;
      }

      const date = document.getElementById('bookDate').value;
      const time = document.getElementById('bookTime').value;
      const notes = document.getElementById('notes').value.trim();

      const confirmBtn = document.getElementById('confirmBtn');
      confirmBtn.disabled = true;
      confirmBtn.innerHTML = '<span class="spinner"></span> Confirming...';

      try {
        const res = await api.post('/api/appointments', {
          mechanicId: parseInt(mechId),
          bikeId: parseInt(bikeId),
          date,
          time,
          notes
        });

        const aptId = res.appointment.id || res.appointment._id;
        window.location.href = `appointment-confirmed.html?id=${aptId}`;
      } catch (err) {
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Confirm Appointment';
        showAlert(err.message || 'Failed to create appointment.');
      }
    }

    loadSummary();
  </script>
</body>
</html>
