<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Mechanic Profile - BikeConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem;">

  <div style="max-width: 550px; width: 100%;">
    <div class="card" style="padding: 2rem 2.5rem;">
      <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem;">
        <i data-lucide="wrench" style="width: 28px; height: 28px; color: var(--primary);"></i>
        <h2 style="font-size: 1.5rem; font-weight: 700;">Complete Mechanic Profile</h2>
      </div>

      <div id="alertBox" class="alert" style="display: none;"></div>

      <form id="profileForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="shopName">Shop / Garage Name *</label>
          <input type="text" id="shopName" class="form-control" placeholder="e.g. Apex Moto Service" required>
        </div>

        <div class="form-group">
          <label for="address">Shop Address *</label>
          <input type="text" id="address" class="form-control" placeholder="Click 'Detect Shop Location' below" readonly required>
        </div>

        <div class="form-group">
          <button type="button" id="detectBtn" class="btn btn-outline btn-block" onclick="detectLocation()">
            <i data-lucide="map-pin"></i> Detect Shop Location (GPS)
          </button>
          <small id="coordText" style="display: none; color: var(--text-muted); margin-top: 0.35rem; display: block;"></small>
        </div>

        <div class="form-group">
          <label for="services">Services Offered (comma separated) *</label>
          <input type="text" id="services" class="form-control" placeholder="Oil Change, Engine Tuning, Brake Repair, Full Servicing" required>
        </div>

        <div class="form-group">
          <label for="description">About Your Garage / Experience</label>
          <textarea id="description" class="form-control" rows="3" placeholder="Tell customers about your workshop, experience and specialities..."></textarea>
        </div>

        <button type="submit" id="saveBtn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;" disabled>
          Save & Go to Dashboard
        </button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    lucide.createIcons();

    let detectedLat = null;
    let detectedLng = null;

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = `alert alert-${type}`;
      box.style.display = 'block';
    }

    function detectLocation() {
      if (!navigator.geolocation) {
        showAlert('Geolocation is not supported by your browser.');
        return;
      }

      const detectBtn = document.getElementById('detectBtn');
      detectBtn.disabled = true;
      detectBtn.innerHTML = '<span class="spinner"></span> Detecting location...';

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          detectedLat = position.coords.latitude;
          detectedLng = position.coords.longitude;

          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${detectedLat}&lon=${detectedLng}&format=json&accept-language=en`);
            const data = await res.json();
            document.getElementById('address').value = data.display_name || `${detectedLat}, ${detectedLng}`;
          } catch (e) {
            document.getElementById('address').value = `GPS: ${detectedLat.toFixed(4)}, ${detectedLng.toFixed(4)}`;
          }

          document.getElementById('coordText').style.display = 'block';
          document.getElementById('coordText').textContent = `Coordinates detected: (${detectedLat.toFixed(4)}, ${detectedLng.toFixed(4)})`;

          detectBtn.disabled = false;
          detectBtn.innerHTML = '<i data-lucide="check-circle" style="color: var(--success);"></i> Location Detected';
          document.getElementById('saveBtn').disabled = false;
          lucide.createIcons();
        },
        (error) => {
          detectBtn.disabled = false;
          detectBtn.innerHTML = '<i data-lucide="map-pin"></i> Detect Shop Location (GPS)';
          showAlert('Failed to detect location: ' + error.message);
          lucide.createIcons();
        }
      );
    }

    async function handleSubmit(e) {
      e.preventDefault();
      if (!detectedLat || !detectedLng) {
        showAlert('Please detect your shop location before submitting.');
        return;
      }

      const shopName = document.getElementById('shopName').value.trim();
      const address = document.getElementById('address').value.trim();
      const services = document.getElementById('services').value.split(',').map(s => s.trim()).filter(s => s);
      const description = document.getElementById('description').value.trim();
      const email = sessionStorage.getItem('otpEmail');

      try {
        await api.post('/mechanic/profile', {
          email,
          shopName,
          address,
          location: {
            latitude: detectedLat,
            longitude: detectedLng
          },
          servicesOffered: services,
          description
        });

        alert('Mechanic profile saved successfully!');
        window.location.href = 'mechanic-dashboard.html';
      } catch (err) {
        showAlert(err.message || 'Failed to save mechanic profile.');
      }
    }
  </script>
</body>
</html>
