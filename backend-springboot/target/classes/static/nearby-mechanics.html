<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Mechanics - BikeConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Leaflet CSS for interactive map directions -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <a href="owner-dashboard.html" class="btn btn-outline btn-sm">
          <i data-lucide="arrow-left"></i> Dashboard
        </a>
        <div>
          <h1 style="font-size: 1.25rem; font-weight: 700;">Nearby Mechanics</h1>
          <p id="mechCountText" style="font-size: 0.85rem; color: var(--text-muted);">Searching nearby mechanics...</p>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div id="alertBox" class="alert" style="display: none;"></div>

    <div id="mechanicsGrid" class="grid-3">
      <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted);">
        <span class="spinner" style="border-top-color: var(--primary); margin-bottom: 0.5rem;"></span>
        <p>Finding mechanics near your location...</p>
      </div>
    </div>
  </main>

  <!-- Directions Modal with Interactive Leaflet Map -->
  <div id="directionsModal" class="modal-overlay" style="display: none;">
    <div class="modal-box" style="max-width: 800px; width: 95%;">
      <div class="modal-header">
        <div>
          <h3 id="modalShopName" style="font-size: 1.25rem; font-weight: 700;">Directions</h3>
          <p id="modalDistanceInfo" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.2rem;">Calculating route...</p>
        </div>
        <button class="btn btn-outline btn-sm" onclick="closeDirectionsModal()">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="modal-body" style="padding: 0;">
        <div id="map" style="width: 100%; height: 420px;"></div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeDirectionsModal()">Close</button>
        <button id="modalBookBtn" class="btn btn-primary">Book Appointment</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script>
    lucide.createIcons();

    const bikeId = api.getQueryParam('bikeId');
    let userLat = parseFloat(api.getQueryParam('lat'));
    let userLon = parseFloat(api.getQueryParam('lon'));

    let map = null;
    let mapMarkerUser = null;
    let mapMarkerDest = null;
    let mapPolyline = null;

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = `alert alert-${type}`;
      box.style.display = 'block';
    }

    async function loadMechanics() {
      // If coordinates not in query params, get from GPS
      if (!userLat || !userLon) {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              userLat = pos.coords.latitude;
              userLon = pos.coords.longitude;
              fetchMechanics();
            },
            () => fetchMechanics()
          );
        } else {
          fetchMechanics();
        }
      } else {
        fetchMechanics();
      }
    }

    async function fetchMechanics() {
      try {
        let endpoint = '/getNearbyMechanics';
        if (userLat && userLon) {
          endpoint += `?latitude=${userLat}&longitude=${userLon}`;
        }

        const res = await api.get(endpoint);
        const mechanics = res.mechanics || [];

        document.getElementById('mechCountText').textContent = `${mechanics.length} verified mechanics found`;

        const grid = document.getElementById('mechanicsGrid');
        if (mechanics.length === 0) {
          grid.innerHTML = `
            <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
              <i data-lucide="map-pin-off" style="width: 48px; height: 48px; color: var(--text-muted); margin-bottom: 0.75rem;"></i>
              <p style="color: var(--text-muted);">No mechanics found nearby. Please try again or expand radius.</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        grid.innerHTML = mechanics.map(mech => {
          const mechId = mech.id || mech._id;
          const phone = mech.userId ? mech.userId.phone : '';
          const distance = mech.distance ? `${mech.distance.toFixed(1)} km away` : 'Nearby';
          const servicesList = mech.servicesOffered ? mech.servicesOffered.split(',').slice(0, 3) : [];

          return `
            <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
                  <h3 style="font-size: 1.2rem; font-weight: 700;">${mech.shopName}</h3>
                  <div style="background: #dcfce7; color: var(--success); padding: 0.2rem 0.5rem; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 0.25rem;">
                    ★ ${mech.rating || 4.5}
                  </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem;">
                  <div style="display: flex; align-items: center; gap: 0.4rem;">
                    <i data-lucide="map-pin" style="width: 16px; height: 16px; color: var(--primary);"></i>
                    <span>${distance}</span>
                  </div>
                  ${phone ? `
                    <div style="display: flex; align-items: center; gap: 0.4rem;">
                      <i data-lucide="phone" style="width: 16px; height: 16px;"></i>
                      <span>${phone}</span>
                    </div>
                  ` : ''}
                </div>

                ${servicesList.length > 0 ? `
                  <div style="display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 1.25rem;">
                    ${servicesList.map(s => `<span class="badge badge-secondary">${s.trim()}</span>`).join('')}
                  </div>
                ` : ''}
              </div>

              <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem;">
                <a href="mechanic-details.html?id=${mechId}&bikeId=${bikeId || ''}" class="btn btn-outline btn-block btn-sm">
                  View Details
                </a>
                <div style="display: flex; gap: 0.5rem;">
                  <button class="btn btn-outline btn-block btn-sm" onclick='showDirections(${JSON.stringify(mech)})'>
                    <i data-lucide="navigation"></i> Directions
                  </button>
                  <a href="booking-details.html?mechanicId=${mechId}&bikeId=${bikeId || ''}" class="btn btn-primary btn-block btn-sm">
                    Book Now
                  </a>
                </div>
              </div>
            </div>
          `;
        }).join('');

        lucide.createIcons();
      } catch (err) {
        showAlert(err.message || 'Failed to fetch mechanics.');
      }
    }

    function showDirections(mech) {
      document.getElementById('modalShopName').textContent = `Directions to ${mech.shopName}`;
      document.getElementById('directionsModal').style.display = 'flex';
      
      const mechId = mech.id || mech._id;
      document.getElementById('modalBookBtn').onclick = () => {
        window.location.href = `booking-details.html?mechanicId=${mechId}&bikeId=${bikeId || ''}`;
      };

      const destLat = mech.latitude;
      const destLon = mech.longitude;

      setTimeout(() => {
        if (!map) {
          map = L.map('map').setView([destLat, destLon], 14);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
          }).addTo(map);
        } else {
          map.invalidateSize();
        }

        // Clean previous markers
        if (mapMarkerUser) map.removeLayer(mapMarkerUser);
        if (mapMarkerDest) map.removeLayer(mapMarkerDest);
        if (mapPolyline) map.removeLayer(mapPolyline);

        // Mechanic Pin
        mapMarkerDest = L.marker([destLat, destLon]).addTo(map)
          .bindPopup(`<b>${mech.shopName}</b><br>Destination Workshop`).openPopup();

        if (userLat && userLon) {
          mapMarkerUser = L.marker([userLat, userLon]).addTo(map)
            .bindPopup('<b>Your Current Location</b>');

          // Draw line
          const bounds = L.latLngBounds([ [userLat, userLon], [destLat, destLon] ]);
          map.fitBounds(bounds, { padding: [50, 50] });

          mapPolyline = L.polyline([ [userLat, userLon], [destLat, destLon] ], {
            color: '#2563eb',
            weight: 4,
            dashArray: '8, 8'
          }).addTo(map);

          const dist = mech.distance ? mech.distance.toFixed(1) : '?';
          document.getElementById('modalDistanceInfo').textContent = `${dist} km road distance | Approx. 15-20 mins`;
        } else {
          map.setView([destLat, destLon], 15);
          document.getElementById('modalDistanceInfo').textContent = `Shop Location: (${destLat.toFixed(4)}, ${destLon.toFixed(4)})`;
        }
      }, 200);
    }

    function closeDirectionsModal() {
      document.getElementById('directionsModal').style.display = 'none';
    }

    loadMechanics();
  </script>
</body>
</html>
