<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP - BikeConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem;">

  <div style="max-width: 420px; width: 100%;">
    <div class="card" style="padding: 2.5rem; text-align: center;">
      <div style="background: #eff6ff; width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
        <i data-lucide="shield-alert" style="width: 32px; height: 32px; color: var(--primary);"></i>
      </div>
      
      <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">Verify Your Email</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem;">
        Enter the 6-digit verification code sent to your email address:
        <strong id="displayEmail" style="color: var(--text-main); display: block; margin-top: 0.25rem;"></strong>
      </p>

      <div id="alertBox" class="alert" style="display: none;"></div>

      <!-- 6-digit OTP Inputs -->
      <div style="display: flex; justify-content: space-between; gap: 0.5rem; margin-bottom: 2rem;">
        <input type="text" maxlength="1" class="form-control otp-input" style="width: 50px; height: 55px; text-align: center; font-size: 1.5rem; font-weight: 700;" autofocus>
        <input type="text" maxlength="1" class="form-control otp-input" style="width: 50px; height: 55px; text-align: center; font-size: 1.5rem; font-weight: 700;">
        <input type="text" maxlength="1" class="form-control otp-input" style="width: 50px; height: 55px; text-align: center; font-size: 1.5rem; font-weight: 700;">
        <input type="text" maxlength="1" class="form-control otp-input" style="width: 50px; height: 55px; text-align: center; font-size: 1.5rem; font-weight: 700;">
        <input type="text" maxlength="1" class="form-control otp-input" style="width: 50px; height: 55px; text-align: center; font-size: 1.5rem; font-weight: 700;">
        <input type="text" maxlength="1" class="form-control otp-input" style="width: 50px; height: 55px; text-align: center; font-size: 1.5rem; font-weight: 700;">
      </div>

      <button id="verifyBtn" class="btn btn-primary btn-block btn-lg" onclick="handleVerify()">
        Verify & Continue
      </button>

      <div style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Didn't receive the code? 
        <button id="resendBtn" onclick="handleResend()" style="background: none; border: none; color: var(--primary); font-weight: 600; cursor: pointer;">
          Resend OTP
        </button>
        <span id="countdownText" style="display: none; color: var(--text-muted);"></span>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    lucide.createIcons();

    const email = sessionStorage.getItem('otpEmail') || 'your email';
    document.getElementById('displayEmail').textContent = email;

    const otpInputs = document.querySelectorAll('.otp-input');
    otpInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
        }
      });
    });

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = `alert alert-${type}`;
      box.style.display = 'block';
    }

    async function handleVerify() {
      const code = Array.from(otpInputs).map(i => i.value).join('');
      if (code.length !== 6) {
        showAlert('Please enter all 6 digits of the OTP.');
        return;
      }

      try {
        const res = await api.post('/auth/verify-otp', { email, otp: code });
        alert('Email verified successfully!');
        window.location.href = 'mechanic-profile.html';
      } catch (err) {
        showAlert(err.message || 'OTP verification failed');
      }
    }

    let timer = 0;
    let timerInterval = null;

    async function handleResend() {
      try {
        const res = await api.post('/auth/resend-otp', { email });
        showAlert(res.message || 'New OTP sent to email!', 'success');
        
        // Start 60s countdown
        timer = 60;
        const resendBtn = document.getElementById('resendBtn');
        const countdownText = document.getElementById('countdownText');
        resendBtn.style.display = 'none';
        countdownText.style.display = 'inline';

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          timer--;
          countdownText.textContent = `(Resend in ${timer}s)`;
          if (timer <= 0) {
            clearInterval(timerInterval);
            resendBtn.style.display = 'inline';
            countdownText.style.display = 'none';
          }
        }, 1000);
      } catch (err) {
        showAlert(err.message || 'Failed to resend OTP');
      }
    }
  </script>
</body>
</html>
