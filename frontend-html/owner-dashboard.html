<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bike Owner Dashboard - BikeConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <a href="owner-dashboard.html" class="logo-group">
        <i data-lucide="bike" class="logo-icon"></i>
        <span>BikeConnect</span>
      </a>
      <div class="header-actions">
        <button id="refreshBtn" class="btn btn-outline btn-sm" onclick="fetchDashboardData(true)" title="Refresh data">
          <i data-lucide="refresh-cw"></i> Refresh
        </button>
        <button class="btn btn-outline btn-sm" onclick="api.logout()">
          <i data-lucide="log-out"></i> Logout
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.25rem;">
          Welcome, <span id="userName" style="color: var(--primary);">User</span>!
        </h1>
        <p style="color: var(--text-muted);">Manage your bikes and track repairs in real time</p>
      </div>
      <a href="add-bike.html" class="btn btn-primary btn-lg">
        <i data-lucide="plus"></i> Add Bike for Repair
      </a>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="alert" style="display: none;"></div>

    <!-- Stats Cards -->
    <div class="grid-3" style="margin-bottom: 2.5rem;">
      <div class="card" style="display: flex; align-items: center; gap: 1.25rem;">
        <div style="background: var(--warning-light); padding: 1rem; border-radius: var(--radius-md);">
          <i data-lucide="clock" style="width: 28px; height: 28px; color: var(--warning);"></i>
        </div>
        <div>
          <div id="statRequested" style="font-size: 1.75rem; font-weight: 700;">0</div>
          <div style="color: var(--text-muted); font-size: 0.9rem;">Requested</div>
        </div>
      </div>

      <div class="card" style="display: flex; align-items: center; gap: 1.25rem;">
        <div style="background: var(--info-light); padding: 1rem; border-radius: var(--radius-md);">
          <i data-lucide="wrench" style="width: 28px; height: 28px; color: var(--info);"></i>
        </div>
        <div>
          <div id="statInRepair" style="font-size: 1.75rem; font-weight: 700;">0</div>
          <div style="color: var(--text-muted); font-size: 0.9rem;">In Repair</div>
        </div>
      </div>

      <div class="card" style="display: flex; align-items: center; gap: 1.25rem;">
        <div style="background: var(--success-light); padding: 1rem; border-radius: var(--radius-md);">
          <i data-lucide="check-circle" style="width: 28px; height: 28px; color: var(--success);"></i>
        </div>
        <div>
          <div id="statReady" style="font-size: 1.75rem; font-weight: 700;">0</div>
          <div style="color: var(--text-muted); font-size: 0.9rem;">Ready for Delivery</div>
        </div>
      </div>
    </div>

    <!-- My Bikes Section -->
    <div style="margin-bottom: 3rem;">
      <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.25rem;">My Bikes</h2>
      <div id="bikesContainer" class="grid-3">
        <div class="card" style="text-align: center; color: var(--text-muted); padding: 2rem;">
          Loading bikes...
        </div>
      </div>
    </div>

    <!-- Recent Appointments Section -->
    <div>
      <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.25rem;">Recent Appointments</h2>
      <div id="appointmentsContainer" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="card" style="text-align: center; color: var(--text-muted); padding: 2rem;">
          Loading appointments...
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    let dashboardData = { bikes: [], appointments: [] };

    function getBadgeClass(status) {
      switch (status) {
        case 'booked':
        case 'requested': return 'badge-warning';
        case 'bike-received':
        case 'in-repair': return 'badge-info';
        case 'under-repair': return 'badge-primary';
        case 'completed':
        case 'ready-for-delivery':
        case 'delivered': return 'badge-success';
        case 'cancelled': return 'badge-danger';
        default: return 'badge-secondary';
      }
    }

    async function fetchDashboardData(isManual = false) {
      const refreshBtn = document.getElementById('refreshBtn');
      if (isManual && refreshBtn) {
        refreshBtn.disabled = true;
      }

      try {
        const user = await api.checkAuth();
        if (!user) {
          window.location.href = 'login.html';
          return;
        }

        document.getElementById('userName').textContent = user.name || user.email;

        const data = await api.get('/api/owner-dashboard');
        dashboardData = data;
        renderDashboard(data);
      } catch (err) {
        console.error(err);
        document.getElementById('alertBox').textContent = err.message || 'Failed to load dashboard data';
        document.getElementById('alertBox').style.display = 'block';
      } finally {
        if (isManual && refreshBtn) {
          refreshBtn.disabled = false;
        }
      }
    }

    function renderDashboard(data) {
      const bikes = data.bikes || [];
      const appointments = data.appointments || [];

      // Calculate stats
      let requested = 0, inRepair = 0, ready = 0;
      bikes.forEach(b => {
        if (b.status === 'requested') requested++;
        else if (b.status === 'in-repair') inRepair++;
        else if (b.status === 'ready-for-delivery' || b.status === 'completed') ready++;
      });
      document.getElementById('statRequested').textContent = requested;
      document.getElementById('statInRepair').textContent = inRepair;
      document.getElementById('statReady').textContent = ready;

      // Render Bikes
      const bikesContainer = document.getElementById('bikesContainer');
      if (bikes.length === 0) {
        bikesContainer.innerHTML = `
          <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 2.5rem;">
            <i data-lucide="bike" style="width: 48px; height: 48px; color: var(--text-muted); margin-bottom: 0.75rem;"></i>
            <p style="color: var(--text-muted); margin-bottom: 1rem;">No bikes added yet.</p>
            <a href="add-bike.html" class="btn btn-primary"><i data-lucide="plus"></i> Add Your Bike</a>
          </div>
        `;
      } else {
        bikesContainer.innerHTML = bikes.map(bike => {
          const bikeId = bike.id || bike._id;
          return `
            <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
                  <div>
                    <h3 style="font-size: 1.2rem; font-weight: 700;">${bike.name}</h3>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">${bike.model} ${bike.registrationNumber ? `&bull; ${bike.registrationNumber}` : ''}</p>
                  </div>
                  <i data-lucide="bike" style="color: var(--primary); width: 28px; height: 28px;"></i>
                </div>
                
                <div style="margin-bottom: 1rem; font-size: 0.9rem;">
                  <span style="color: var(--text-muted);">Problem:</span>
                  <p style="margin-top: 0.25rem;">${bike.problem}</p>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
                  <span class="badge ${getBadgeClass(bike.status)}">${bike.status.replace(/-/g, ' ')}</span>
                  <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: capitalize;">${bike.serviceType}</span>
                </div>
              </div>

              <div style="display: flex; gap: 0.5rem;">
                <a href="repair-status.html?bikeId=${bikeId}" class="btn btn-outline btn-block btn-sm">
                  <i data-lucide="activity"></i> Track Status
                </a>
                <a href="nearby-mechanics.html?bikeId=${bikeId}&lat=${bike.latitude || ''}&lon=${bike.longitude || ''}" class="btn btn-primary btn-block btn-sm">
                  Mechanics
                </a>
              </div>
            </div>
          `;
        }).join('');
      }

      // Render Appointments
      const aptContainer = document.getElementById('appointmentsContainer');
      if (appointments.length === 0) {
        aptContainer.innerHTML = `
          <div class="card" style="text-align: center; color: var(--text-muted); padding: 2rem;">
            No appointments booked yet.
          </div>
        `;
      } else {
        aptContainer.innerHTML = appointments.map(apt => {
          const aptId = apt.id || apt._id;
          const bikeName = apt.bikeId ? `${apt.bikeId.name} ${apt.bikeId.model}` : 'Bike';
          const mechanicName = apt.mechanicId ? (apt.mechanicId.shopName || apt.mechanicId.name) : 'Assigned Mechanic';

          return `
            <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
              <div style="display: flex; align-items: center; gap: 1rem;">
                <div style="background: var(--primary-light); padding: 0.75rem; border-radius: var(--radius-md);">
                  <i data-lucide="calendar" style="width: 24px; height: 24px; color: var(--primary);"></i>
                </div>
                <div>
                  <h4 style="font-weight: 700; margin-bottom: 0.25rem;">Appointment for ${bikeName}</h4>
                  <p style="color: var(--text-muted); font-size: 0.85rem;">
                    ${apt.date} at ${apt.time} &bull; With: <strong>${mechanicName}</strong>
                  </p>
                  ${apt.mechanicNotes ? `<p style="font-size: 0.85rem; color: var(--info); margin-top: 0.25rem;">Mechanic notes: ${apt.mechanicNotes}</p>` : ''}
                </div>
              </div>

              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <span class="badge ${getBadgeClass(apt.status)}">${apt.status.replace(/-/g, ' ')}</span>
                <a href="appointment-confirmed.html?id=${aptId}" class="btn btn-outline btn-sm">
                  View Details
                </a>
                <a href="repair-status.html?bikeId=${apt.bikeId ? (apt.bikeId.id || apt.bikeId._id) : ''}" class="btn btn-primary btn-sm">
                  Track
                </a>
              </div>
            </div>
          `;
        }).join('');
      }

      lucide.createIcons();
    }

    // Auto-refresh every 30 seconds
    fetchDashboardData();
    setInterval(() => fetchDashboardData(false), 30000);
  </script>
</body>
</html>
